# nginx-Konfiguration fuer die Verzehrabrechnung
#
# Installation:
#   1. BEISPIEL.de in beiden Dateien durch die eigene Domain ersetzen
#   2. Zertifikat holen:
#        certbot certonly --standalone -d BEISPIEL.de -d www.BEISPIEL.de
#   3. cp verzehr-http.conf /etc/nginx/sites-available/verzehr-http.conf
#      cp verzehr.conf        /etc/nginx/sites-available/verzehr.conf
#      ln -s ../sites-available/verzehr.conf       /etc/nginx/sites-enabled/
#      ln -s ../sites-available/verzehr-http.conf /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#
# Wichtig: Die Anwendung laeuft auf 127.0.0.1:8000 und ist von aussen nicht
# erreichbar. Das Spielzeug ist nur ueber HTTPS erreichbar.

upstream verzehr_app {
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 16;
}

# Rate limiting fuer den Login-Schutz der Anwendung
limit_req_zone $binary_remote_addr zone=verzehr_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name BEISPIEL.de www.BEISPIEL.de;

    # Certbot-Challenge erreichbar lassen
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name BEISPIEL.de www.BEISPIEL.de;

    ssl_certificate     /etc/letsencrypt/live/BEISPIEL.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/BEISPIEL.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 16m;      # entspricht MAX_CONTENT_LENGTH
    proxy_read_timeout 90s;

    access_log /var/log/nginx/verzehr.access.log;
    error_log  /var/log/nginx/verzehr.error.log;

    # Session-Cookie nur ueber HTTPS
    proxy_cookie_flags pps_session secure httponly samesite=lax;

    location = /healthz {
        proxy_pass http://verzehr_app;
        access_log off;
    }

    location = /login {
        limit_req zone=verzehr_login burst=5 nodelay;
        proxy_pass http://verzehr_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://verzehr_app;
        proxy_cache_valid 200 1h;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://verzehr_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }
}
