# HTTP-only: leitet auf HTTPS um und stellt den Certbot-Challenge bereit.
# BEISPIEL.de ersetzen, dann nach /etc/nginx/sites-available/verzehr-http.conf
# kopieren und in /etc/nginx/sites-enabled/ verlinken.

server {
    listen 80;
    listen [::]:80;
    server_name BEISPIEL.de www.BEISPIEL.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
