{% macro csrf_field() -%}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{%- endmacro %}

{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  {%- if name == 'home' -%}
    <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>
  {%- elif name == 'plus' -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == 'minus' -%}
    <path d="M5 12h14"/>
  {%- elif name == 'users' -%}
    <circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 11.2A3 3 0 0 0 16 5.3"/><path d="M18 20c0-2.4-.9-4.2-2.4-5.3"/>
  {%- elif name == 'box' -%}
    <path d="M21 8.5 12 4 3 8.5v7L12 20l9-4.5z"/><path d="M3 8.5 12 13l9-4.5M12 13v7"/>
  {%- elif name == 'invoice' -%}
    <path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/>
  {%- elif name == 'gear' -%}
    <circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"/>
  {%- elif name == 'shield' -%}
    <path d="M12 3l7 3v6c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6z"/><path d="M9.2 12.2 11.2 14.2 15 10.4"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
  {%- elif name == 'logout' -%}
    <path d="M14 8V5.5H5v13h9V16"/><path d="M11 12h9M17 9l3 3-3 3"/>
  {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8 20 20"/>
  {%- elif name == 'download' -%}
    <path d="M12 4v11M8 11.5l4 4 4-4"/><path d="M5 19h14"/>
  {%- elif name == 'upload' -%}
    <path d="M12 15V4M8 7.5l4-4 4 4"/><path d="M5 19h14"/>
  {%- elif name == 'check' -%}
    <path d="M5 12.5 10 17.5 19 7.5"/>
  {%- elif name == 'x' -%}
    <path d="M6 6l12 12M18 6 6 18"/>
  {%- elif name == 'mail' -%}
    <rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.6 7 8.4 6 8.4-6"/>
  {%- elif name == 'trash' -%}
    <path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>
  {%- elif name == 'refresh' -%}
    <path d="M20 11.5A8 8 0 0 0 6.3 6.3L4 8.5"/><path d="M4 4.5v4h4"/><path d="M4 12.5A8 8 0 0 0 17.7 17.7L20 15.5"/><path d="M20 19.5v-4h-4"/>
  {%- elif name == 'save' -%}
    <path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h7V4M8 20v-6h8v6"/>
  {%- elif name == 'edit' -%}
    <path d="M4 20h4l10-10-4-4L4 16z"/><path d="m14 6 4 4"/>
  {%- elif name == 'arrow-left' -%}
    <path d="M19 12H5M11 6l-6 6 6 6"/>
  {%- elif name == 'arrow-right' -%}
    <path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif name == 'database' -%}
    <ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>
  {%- elif name == 'alert' -%}
    <path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17.2v.1"/>
  {%- elif name == 'wallet' -%}
    <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a1 1 0 0 1 1 1v2"/><path d="M4 7.5V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5z"/><circle cx="16" cy="14" r="1.2"/>
  {%- elif name == 'paypal' -%}
    <path d="M7 20l1.4-8.5H6.2L7.6 4h5.1c2.9 0 4.6 1.6 4.2 4.3-.4 2.7-2.3 4.2-5.1 4.2H9.6L8.9 20z"/><path d="M5.6 15.5 7 4"/>
  {%- endif -%}
</svg>
{%- endmacro %}

{% macro status_badge(status) -%}
<span class="badge badge-{{ status.value|lower|replace(' ', '-') }}">{{ status.value }}</span>
{%- endmacro %}

{% macro money(value, currency) -%}
<span class="money">{{ value|money(currency) }}</span>
{%- endmacro %}
